[project]
name = "logging-examples"
version = "0.1.0"
description = "Logging examples"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Keep ruff's pre-0.17 default rule set so ruff upgrades don't enable new lint rules
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
exclude = [".venv"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
