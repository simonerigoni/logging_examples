[project]
name = "logging-examples"
version = "0.1.0"
description = "Logging examples"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Simone Rigoni" }]
dependencies = [
    "pandas>=3.1.1",
]


[project.urls]
Homepage = "https://github.com/simonerigoni/logging_examples"
Repository = "https://github.com/simonerigoni/logging_examples"
Medium = "https://medium.com/@simone-rigoni01/logging-with-logging-in-python-d3d8eb9a155a"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
